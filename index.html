<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Queen Habiba 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background: #090014;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }

        /* Animation Canvas */
        #mainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Card Container */
        .container {
            width: 90%;
            max-width: 430px;
            z-index: 10;
            margin: 20px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 30px;
            padding: 35px 22px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.4), inset 0 0 20px rgba(255, 105, 180, 0.2);
            animation: cardGlow 4s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes cardGlow {
            0% { transform: translateY(0px); box-shadow: 0 0 25px rgba(255, 20, 147, 0.4); }
            100% { transform: translateY(-8px); box-shadow: 0 0 45px rgba(255, 105, 180, 0.7); }
        }

        .romantic-title {
            font-family: 'Great Vibes', cursive;
            font-size: 44px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b, #ffcca1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 65, 108, 0.6);
        }

        /* Cake & Candle */
        .cake-container {
            margin: 15px 0;
            cursor: pointer;
            display: inline-block;
            position: relative;
        }

        .candle {
            width: 12px;
            height: 35px;
            background: linear-gradient(#ff758c, #ff7eb3);
            border-radius: 6px;
            margin: 0 auto;
            position: relative;
        }

        .flame {
            width: 14px;
            height: 20px;
            background: #ffbc00;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -18px;
            left: -1px;
            box-shadow: 0 0 15px #ffbc00, 0 0 25px #ff4500;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.15) rotate(2deg); }
        }

        .cake-body {
            font-size: 50px;
            margin-top: -10px;
        }

        /* Input & Button */
        .input-box {
            width: 85%;
            padding: 12px 20px;
            font-size: 20px;
            text-align: center;
            border: 2px solid rgba(255, 105, 180, 0.6);
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            margin: 18px 0;
            letter-spacing: 5px;
            transition: 0.3s;
        }
        .input-box:focus {
            border-color: #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .btn-magic {
            background: linear-gradient(45deg, #ff007f, #ff5e62);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
            transition: all 0.3s ease;
        }
        .btn-magic:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(255, 0, 127, 1);
        }

        /* Music Button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            animation: spin 8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Unlocked Secret Content */
        #secret-content {
            display: none;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .grid-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 182, 193, 0.4);
            padding: 12px 10px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .grid-btn:hover {
            background: rgba(255, 0, 127, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.6);
        }

        .typewriter-box {
            font-size: 14px;
            line-height: 1.7;
            color: #ffe6f2;
            min-height: 85px;
            margin: 15px 0;
            text-shadow: 0 0 8px rgba(255, 192, 203, 0.6);
        }

        .popup-modal {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            border: 1px dashed #ff758c;
            font-size: 13px;
            animation: fadeIn 0.4s;
            line-height: 1.6;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Animation Canvas -->
    <canvas id="mainCanvas"></canvas>

    <!-- Background Music -->
    <div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</div>
<audio id="bgAudio" loop src="Atif Aslam - Dil Diyan Gallan (Lyrics) (Tiger Zinda Hai Soundtrack) - NH Soul Tune (128k).mp3"></audio>

    <div class="container">
        <!-- Lock Page -->
        <div class="glass-card" id="lockCard">
            <div class="cake-container" onclick="blowCandle()">
                <div class="candle"><div class="flame" id="flame"></div></div>
                <div class="cake-body">🎂</div>
            </div>
            
            <h1 class="romantic-title">Happy Birthday Habiba</h1>
            <p style="font-size: 14px; opacity: 0.9;">Enter PIN to unlock magic ✨</p>
            
            <input type="password" id="passInput" class="input-box" placeholder="••••" maxlength="6">
            <br>
            <button class="btn-magic" onclick="unlockSurprise()">Unlock ✨</button>
            <p id="errorTxt" style="color: #ff4d4d; font-size: 13px; margin-top: 12px; display: none; font-weight: bold;">Oops! Wrong PIN 🙈 Try again!</p>
        </div>

        <!-- Unlocked Dashboard -->
        <div class="glass-card" id="secret-content">
            <div style="font-size: 50px; cursor: pointer;" onclick="burstHearts(event)">👑💖✨</div>
            <h1 class="romantic-title">Happy Birthday Habiba! 🌸</h1>
            
            <div class="typewriter-box" id="typewriterText"></div>

            <div class="grid-buttons">
                <button class="grid-btn" onclick="showPopup('letter')">💌 Romantic Letter</button>
                <button class="grid-btn" onclick="releaseBalloons()">🎈 100 Love Balloons</button>
                <button class="grid-btn" onclick="showPopup('hug')">🤗 Virtual Hug</button>
                <button class="grid-btn" onclick="showPopup('promise')">💍 Forever Promise</button>
            </div>

            <div class="popup-modal" id="popupBox"></div>
        </div>
    </div>

    <script>
        // ================= PASSWORD SETUP =================
        const CORRECT_PIN = "1008"; 


        // ================= CANVAS ANIMATION ENGINE =================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Stars
        let stars = [];
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        // Shooting Stars
        let shootingStars = [];
        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height / 2),
                len: Math.random() * 80 + 50,
                speed: Math.random() * 8 + 6,
                size: Math.random() * 2 + 1,
                alpha: 1
            });
        }
        setInterval(createShootingStar, 2500);

        // Floating Heart Balloons
        let balloons = [];
        const balloonColors = ['#ff007f', '#ff416c', '#ff758c', '#e040fb', '#ff5252'];

        function createBalloon() {
            balloons.push({
                x: Math.random() * canvas.width,
                y: canvas.height + 50,
                size: Math.random() * 15 + 18,
                color: balloonColors[Math.floor(Math.random() * balloonColors.length)],
                speedY: Math.random() * 1.8 + 1,
                swing: Math.random() * 0.05,
                swingAngle: Math.random() * Math.PI * 2
            });
        }
        setInterval(createBalloon, 800);

        // Sparkles & Particles
        let particles = [];
        function createBurst(x, y, count = 25) {
            const chars = ['💖', '✨', '🌸', '💓', '⭐', '🎈'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    char: chars[Math.floor(Math.random() * chars.length)],
                    size: Math.random() * 18 + 12,
                    alpha: 1
                });
            }
        }

        // Main Animation Loop
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Stars
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Draw Shooting Stars
            shootingStars.forEach((ss, idx) => {
                ss.x += ss.speed;
                ss.y += ss.speed * 0.5;
                ss.alpha -= 0.015;

                ctx.strokeStyle = `rgba(255, 255, 255, ${ss.alpha})`;
                ctx.lineWidth = ss.size;
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - ss.len, ss.y - ss.len * 0.5);
                ctx.stroke();

                if (ss.alpha <= 0) shootingStars.splice(idx, 1);
            });

            // 3. Draw Heart Balloons
            balloons.forEach((b, idx) => {
                b.y -= b.speedY;
                b.swingAngle += b.swing;
                b.x += Math.sin(b.swingAngle) * 0.8;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-b.size, -b.size, -b.size * 1.5, b.size / 3, 0, b.size);
                ctx.bezierCurveTo(b.size * 1.5, b.size / 3, b.size, -b.size, 0, 0);
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 10;
                ctx.fill();

                // Balloon String
                ctx.beginPath();
                ctx.moveTo(0, b.size);
                ctx.lineTo(Math.sin(b.swingAngle * 2) * 8, b.size + 30);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();

                if (b.y < -60) balloons.splice(idx, 1);
            });

            // 4. Draw Particles
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;

                ctx.save();
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.font = `${p.size}px serif`;
                ctx.fillText(p.char, p.x, p.y);
                ctx.restore();

                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            requestAnimationFrame(render);
        }
        render();

        // Screen Click Blast Effect
        window.addEventListener('click', (e) => {
            if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                createBurst(e.clientX, e.clientY);
            }
        });

        // ================= INTERACTIVE FEATURES =================

        // Blow Candle
        function blowCandle() {
            const flame = document.getElementById('flame');
            if(flame) {
                flame.style.display = 'none';
                createBurst(window.innerWidth / 2, window.innerHeight / 2 - 100, 50);
            }
        }

        // Music Toggle
        const audio = document.getElementById('bgAudio');
        let playing = false;
        function toggleMusic() {
            if(playing) {
                audio.pause();
                document.getElementById('musicBtn').style.animationPlayState = 'paused';
            } else {
                audio.play();
                document.getElementById('musicBtn').style.animationPlayState = 'running';
            }
            playing = !playing;
        }

        // Unlock Logic
        function unlockSurprise() {
            const input = document.getElementById('passInput').value.trim();
            const errorTxt = document.getElementById('errorTxt');
            const inputBox = document.getElementById('passInput');
            
            if(input === CORRECT_PIN) { 
                errorTxt.style.display = 'none';
                document.getElementById('lockCard').style.display = 'none';
                document.getElementById('secret-content').style.display = 'block';
                startTypewriter();
                if(!playing) toggleMusic();
                createBurst(window.innerWidth/2, window.innerHeight/2, 60);
            } else {
                errorTxt.style.display = 'block';
                inputBox.style.animation = 'shake 0.3s';
                setTimeout(() => { inputBox.style.animation = ''; }, 300);
            }
        }

        // Typewriter Effect
        const note = "Wishing the sweetest person in my life a very happy birthday, Habiba! May every moment of yours be filled with endless love and joy. Always keep that beautiful smile on your face! 💖✨";
        let idx = 0;
        function startTypewriter() {
            if(idx < note.length) {
                document.getElementById('typewriterText').innerHTML += note.charAt(idx);
                idx++;
                setTimeout(startTypewriter, 40);
            }
        }

        // Release 100 Balloons
        function releaseBalloons() {
            for(let i=0; i<60; i++) {
                setTimeout(createBalloon, i * 40);
            }
        }

        // Popup Messages (All English)
        function showPopup(type) {
            const box = document.getElementById('popupBox');
            box.style.display = 'block';
            createBurst(window.innerWidth/2, window.innerHeight/2, 30);

            if(type === 'letter') {
                box.innerHTML = "💌 <b>Dearest Habiba,</b><br>You are the most wonderful gift in my life. Every single moment spent with you is a precious memory. I love you so much! ❤️";
            } else if(type === 'hug') {
                box.innerHTML = "🤗 <b>Sending you the warmest virtual hugs and sweetest kisses! 💋✨</b>";
            } else if(type === 'promise') {
                box.innerHTML = "💍 <b>My Promise:</b><br>I promise to stay by your side forever and always protect your priceless smile! 🌸";
            }
        }
    </script>
</body>
</html>
