<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Queen Habiba 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(-45deg, #0d001a, #2a082e, #4a0033, #15002b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ক্যানভাস ব্যাকগ্রাউন্ড */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* কার্ড কন্টেইনার */
        .container {
            width: 90%;
            max-width: 420px;
            z-index: 10;
            margin: 20px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3), inset 0 0 15px rgba(255, 105, 180, 0.2);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(0.5deg); }
        }

        .title {
            font-family: 'Pacifico', cursive, 'Hind Siliguri';
            font-size: 28px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #ffcca1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
        }

        /* লাভ হার্ট পালস */
        .heart-crown {
            font-size: 55px;
            display: inline-block;
            animation: pulseHeart 1s infinite alternate;
            cursor: pointer;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 5px #ff416c); }
            100% { transform: scale(1.2) rotate(5deg); filter: drop-shadow(0 0 20px #ff416c); }
        }

        /* ইনপুট ও বাটন */
        .input-box {
            width: 85%;
            padding: 12px 20px;
            font-size: 18px;
            text-align: center;
            border: 2px solid rgba(255, 105, 180, 0.6);
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            margin: 15px 0;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
            transition: 0.3s;
        }
        .input-box:focus {
            border-color: #ff2a70;
            box-shadow: 0 0 25px rgba(255, 42, 112, 0.8);
        }

        .btn-glow {
            background: linear-gradient(45deg, #ff007f, #ff5e62);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-glow:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.9);
        }

        /* মিউজিক প্লেয়ার বাটন */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
            animation: spinMusic 8s linear infinite;
        }
        @keyframes spinMusic { 100% { transform: rotate(360deg); } }

        /* আনলক করা কন্টেন্ট */
        #secret-content {
            display: none;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ইন্টারঅ্যাক্টিভ বাটন গ্রিড */
        .interactive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .grid-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 182, 193, 0.3);
            padding: 12px 8px;
            border-radius: 18px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .grid-btn:hover {
            background: rgba(255, 105, 180, 0.4);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.5);
        }

        .typewriter-text {
            font-size: 15px;
            line-height: 1.7;
            color: #ffe6f2;
            min-height: 70px;
            margin: 15px 0;
            text-shadow: 0 0 8px rgba(255, 192, 203, 0.5);
        }

        /* পপআপ ডায়ালগ */
        .popup-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            border: 1px dashed #ff758c;
            font-size: 14px;
            animation: fadeIn 0.4s;
        }

        /* লাভ মিটার অ্যানিমেশন */
        .meter-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .meter-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #ff758c);
            transition: width 2s ease-in-out;
            box-shadow: 0 0 10px #ff007f;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="music-btn" id="musicToggle" onclick="toggleAudio()">🎵</div>
    <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3"></audio>

    <div class="container">
        <div class="card" id="lockCard">
            <div class="heart-crown" onclick="explodeHearts(event)">👑💖</div>
            <h1 class="title">Happy Birthday Habiba!</h1>
            <p style="font-size: 14px; opacity: 0.9;">আমার ভালোবাসার রাজকন্যার গোপন পাসওয়ার্ডটি দাও ✨</p>
            
            <input type="password" id="passInput" class="input-box" placeholder="••••">
            <br>
            <button class="btn-glow" onclick="checkPass()">আনলক করো ✨</button>
            <p id="errorText" style="color: #ff4d4d; font-size: 12px; margin-top: 10px; display: none;">উফফ! ভুল পাসওয়ার্ড 🙈 আবার চেষ্টা করো!</p>
        </div>

        <div class="card" id="secret-content">
            <div class="heart-crown" onclick="explodeHearts(event)">💖🎂✨</div>
            <h1 class="title">শুভ জন্মদিন হাবিবু! 🌸</h1>
            
            <div class="typewriter-text" id="typewriter"></div>

            <div class="interactive-grid">
                <button class="grid-btn" onclick="openBox('letter')">💌 ভালোবাসার চিঠি</button>
                <button class="grid-btn" onclick="openBox('hug')">🤗 জাদুকরী জড়িয়ে ধরা</button>
                <button class="grid-btn" onclick="openBox('meter')">📊 লাভ মিটার টেস্ট</button>
                <button class="grid-btn" onclick="openBox('promise')">💍 চিরদিনের ওয়াদা</button>
            </div>

            <div class="popup-box" id="popupBox"></div>
        </div>
    </div>

    <script>
        // ১. ক্যানভাস অ্যানিমেশন ও হার্ট এক্সপ্লোশন
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || canvas.height + 20;
                this.size = Math.random() * 18 + 10;
                this.speedY = isExplosion ? (Math.random() - 0.5) * 8 : -(Math.random() * 2 + 1);
                this.speedX = isExplosion ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 1.5;
                this.color = `hsl(${Math.random() * 50 + 320}, 100%, 70%)`;
                this.opacity = 1;
                this.isExplosion = isExplosion;
                this.char = ['💖', '🌸', '✨', '💕', '🌹', '❤️'][Math.floor(Math.random() * 6)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.isExplosion) {
                    this.opacity -= 0.02;
                } else if (this.y < -20) {
                    this.y = canvas.height + 20;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.opacity, 0);
                ctx.font = `${this.size}px serif`;
                ctx.fillText(this.char, this.x, this.y);
                ctx.restore();
            }
        }

        for (let i = 0; i < 25; i++) {
            particles.push(new Particle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.isExplosion && p.opacity <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        function explodeHearts(e) {
            const x = e.clientX || window.innerWidth / 2;
            const y = e.clientY || window.innerHeight / 2;
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(x, y, true));
            }
        }
        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                explodeHearts(e);
            }
        });

        // ২. ব্যাকগ্রাউন্ড গান
        const audio = document.getElementById('bgMusic');
        let isPlaying = false;
        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                document.getElementById('musicToggle').style.animationPlayState = 'paused';
            } else {
                audio.play();
                document.getElementById('musicToggle').style.animationPlayState = 'running';
            }
            isPlaying = !isPlaying;
        }

        // ৩. পাসওয়ার্ড আনলক
        function checkPass() {
            const val = document.getElementById('passInput').value.toLowerCase().trim();
            // যেকোনো পাসওয়ার্ড লিখলেই আনলক হবে
            if (val !== "") {
                document.getElementById('lockCard').style.display = 'none';
                document.getElementById('secret-content').style.display = 'block';
                startTypewriter();
                toggleAudio(); // গান অটো-প্লে শুরু হবে
                explodeHearts({ clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 });
            } else {
                document.getElementById('errorText').style.display = 'block';
            }
        }

        // ৪. টাইপরাইটার অ্যানিমেশন
        const loveNote = "আমার মিষ্টি হাবিবু, আজকের এই বিশেষ দিনে তোমার হাসিমুখটাই আমার সেরা উপহার। তুমি পাশে থাকলে পুরো পৃথিবীটা অনেক বেশি সুন্দর মনে হয়! শুভ জন্মদিন আমার রানি! 💕✨";
        let textIdx = 0;
        function startTypewriter() {
            if (textIdx < loveNote.length) {
                document.getElementById('typewriter').innerHTML += loveNote.charAt(textIdx);
                textIdx++;
                setTimeout(startTypewriter, 45);
            }
        }

        // ৫. পপআপ সার্ভিসেস
        function openBox(type) {
            const box = document.getElementById('popupBox');
            box.style.display = 'block';

            if(type === 'letter') {
                box.innerHTML = "💌 <b>চিঠি:</b><br>হাবিবু, জীবনের বাকি পথটাও ঠিক এভাবে তোমার হাত ধরে হেঁটে যেতে চাই। ভালোবাসি তোমায় অনেক অনেক! ❤️";
            } else if(type === 'hug') {
                box.innerHTML = "🤗 <b>ভার্চুয়াল কোলাকুলি:</b><br>অনেকগুলো আঁটসাঁট জাদুকরী জড়িয়ে ধরা আর সাথে অনেকগুলো মিষ্টি চুমু! 💋✨";
            } else if(type === 'meter') {
                box.innerHTML = `
                    💖 <b>ভালোবাসার পরিমাপ:</b> ♾️ ১০০০০% (অসীম!)
                    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
                `;
                setTimeout(() => {
                    document.getElementById('meterFill').style.width = '100%';
                }, 100);
            } else if(type === 'promise') {
                box.innerHTML = "💍 <b>ওয়াদা:</b><br>কথা দিচ্ছি, হাজারো ব্যস্ততার মাঝেও তোমার মুখের হাসিটা কখনো মুছে যেতে দেবো না! 🥰";
            }
        }
    </script>
</body>
</html>
